<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CaissePro Mobile</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 14px; background: #0f172a; color: #f8fafc; padding-bottom: 40px; }
    h1 { font-size: 19px; text-align: center; margin: 4px 0 14px 0; color: #38bdf8; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .card { background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid #334155; }
    .card.full { grid-column: span 2; background: #064e3b; border-color: #10b981; }
    .card.warn { background: #451a03; border-color: #f59e0b; }
    .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .val { font-size: 19px; font-weight: bold; margin-top: 4px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; background: #1e293b; padding: 5px; border-radius: 12px; }
    .tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer; color: #94a3b8; border: none; background: transparent; }
    .tab.active { background: #38bdf8; color: #0f172a; }
    .section { display: none; background: #1e293b; padding: 16px; border-radius: 14px; border: 1px solid #334155; }
    .section.active { display: block; }
    label { display: block; font-size: 13px; margin-top: 12px; color: #cbd5e1; }
    input, select { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 15px; }
    button.action-btn { width: 100%; padding: 14px; margin-top: 18px; background: #10b981; color: #0f172a; font-weight: bold; font-size: 15px; border: none; border-radius: 10px; cursor: pointer; }
    button.action-btn:disabled { background: #475569; color: #94a3b8; }
    .item-card { background: #0f172a; padding: 12px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .item-info { font-size: 13px; line-height: 1.4; }
    .item-title { font-weight: bold; font-size: 14px; color: #f8fafc; }
    .btn-paye { background: #10b981; color: #0f172a; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .badge-stock { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; background: #1e293b; color: #38bdf8; }
    .badge-low { background: #7f1d1d; color: #fca5a5; }
    #toast { text-align: center; margin-top: 12px; font-weight: bold; color: #34d399; font-size: 14px; }
  </style>
</head>
<body>
  <h1 id="titreBoutique">📊 Chargement...</h1>
  <div class="grid">
    <div class="card full"><div class="label">Bénéfice Net Encaissé</div><div class="val" id="benefice">...</div></div>
    <div class="card"><div class="label">Chiffre d'Affaires</div><div class="val" id="ca">...</div></div>
    <div class="card warn"><div class="label">Chez Livreurs (<span id="nbColis">0</span>)</div><div class="val" id="livreurs">...</div></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="ouvrirOnglet('tabVente', this)">➕ Vente</button>
    <button class="tab" onclick="ouvrirOnglet('tabLivreurs', this)">🛵 Livreurs</button>
    <button class="tab" onclick="ouvrirOnglet('tabProduits', this)">📦 Produits</button>
  </div>
  <div id="toast"></div>
  <div id="tabVente" class="section active">
    <div style="font-weight:bold; font-size:15px;">Nouvelle commande</div>
    <label>Nom du client</label><input type="text" id="client" placeholder="Ex: Koné Awa">
    <label>Produit vendu</label><select id="produit"></select>
    <label>Quantité</label><input type="number" id="quantite" value="1" min="1">
    <label>Nom du livreur</label><input type="text" id="livreur" placeholder="Ex: Moussa">
    <label>Statut du paiement</label>
    <select id="statut">
      <option value="En cours (Chez livreur)">En cours (Chez livreur)</option>
      <option value="Payé">Payé (Encaissé)</option>
      <option value="Annulé">Annulé</option>
    </select>
    <button class="action-btn" id="btnVente" onclick="sauvegarderVente()">Enregistrer la vente</button>
  </div>
  <div id="tabLivreurs" class="section">
    <div style="font-weight:bold; font-size:15px; margin-bottom:12px;">Colis en attente d'encaissement</div>
    <div id="listeLivreurs">Chargement...</div>
  </div>
  <div id="tabProduits" class="section">
    <div style="font-weight:bold; font-size:15px;">➕ Ajouter un nouveau produit</div>
    <label>Nom du produit</label><input type="text" id="newNom" placeholder="Ex: Sac à main cuir">
    <label>Prix d'achat / Coût (FCFA)</label><input type="number" id="newAchat" placeholder="Ex: 6000">
    <label>Prix de vente client (FCFA)</label><input type="number" id="newVente" placeholder="Ex: 12000">
    <label>Stock initial disponible</label><input type="number" id="newStock" placeholder="Ex: 15">
    <button class="action-btn" id="btnProd" onclick="ajouterProduit()">Ajouter au catalogue</button>
    <div style="font-weight:bold; font-size:15px; margin-top:24px; margin-bottom:10px; border-top:1px solid #334155; padding-top:16px;">📦 Mon Stock Actuel</div>
    <div id="listeProduits">Chargement...</div>
  </div>
  <script>
    const API_URL = "https://google.com";
    const idBoutique = new URLSearchParams(window.location.search).get('b') || 'demo';

    function ouvrirOnglet(id, btn) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
      document.getElementById('toast').innerText = "";
    }

    function afficherMessage(txt) {
      const t = document.getElementById('toast');
      t.innerText = txt;
      setTimeout(() => { t.innerText = ""; }, 4000);
    }

    function chargerDonnees() {
      fetch(API_URL + "?b=" + encodeURIComponent(idBoutique))
        .then(r => r.json())
        .then(data => {
          document.getElementById('titreBoutique').innerText = "📊 " + data.nomBoutique;
          document.getElementById('benefice').innerText = data.benefice.toLocaleString('fr-FR') + ' FCFA';
          document.getElementById('ca').innerText = data.ca.toLocaleString('fr-FR') + ' FCFA';
          document.getElementById('livreurs').innerText = data.livreurs.toLocaleString('fr-FR') + ' FCFA';
          document.getElementById('nbColis').innerText = data.colisEnCours.length;

          const select = document.getElementById('produit');
          const divProd = document.getElementById('listeProduits');
          select.innerHTML = '';
          divProd.innerHTML = data.produits.length ? '' : '<div style="color:#94a3b8;font-size:13px;">Aucun produit.</div>';

          data.produits.forEach(p => {
            let opt = document.createElement('option');
            opt.value = p.nom;
            opt.innerText = p.nom + ' (' + p.prixVente.toLocaleString('fr-FR') + ' F - Stock: ' + p.stockRestant + ')';
            select.appendChild(opt);
            const cls = p.stockRestant <= 3 ? 'badge-stock badge-low' : 'badge-stock';
            divProd.innerHTML += '<div class="item-card"><div class="item-info"><div class="item-title">' + p.nom + '</div><div style="color:#94a3b8;">Vente : ' + p.prixVente.toLocaleString('fr-FR') + ' FCFA</div></div><div class="' + cls + '">Stock : ' + p.stockRestant + '</div></div>';
          });

          const divLiv = document.getElementById('listeLivreurs');
          divLiv.innerHTML = data.colisEnCours.length ? '' : '<div style="color:#94a3b8;font-size:13px;">Aucun argent dehors 🎉</div>';
          data.colisEnCours.forEach(c => {
            divLiv.innerHTML += '<div class="item-card"><div class="item-info"><div class="item-title">' + c.client + ' (' + c.total.toLocaleString('fr-FR') + ' F)</div><div style="color:#94a3b8;">' + c.produit + ' (x' + c.quantite + ') • 🛵 <b>' + c.livreur + '</b></div></div><button class="btn-paye" onclick="marquerPaye(' + c.ligneSheet + ', this)">✅ Payé</button></div>';
          });
        })
        .catch(() => { document.getElementById('titreBoutique').innerText = "❌ Erreur de connexion API"; });
    }

    function sauvegarderVente() {
      const prod = document.getElementById('produit').value;
      if (!prod) { alert("Ajoutez d'abord un produit !"); return; }
      const btn = document.getElementById('btnVente');
      btn.disabled = true; btn.innerText = "Enregistrement...";
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "nouvelle_vente", idBoutique: idBoutique, client: document.getElementById('client').value || "Client Boutique", produit: prod, quantite: document.getElementById('quantite').value, livreur: document.getElementById('livreur').value || "Boutique", statut: document.getElementById('statut').value })
      }).then(r => r.json()).then(rep => {
        afficherMessage(rep.message);
        document.getElementById('client').value = "";
        btn.disabled = false; btn.innerText = "Enregistrer la vente";
        chargerDonnees();
      });
    }

    function marquerPaye(ligne, btn) {
      btn.disabled = true; btn.innerText = "...";
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "marquer_paye", idBoutique: idBoutique, ligneSheet: ligne })
      }).then(r => r.json()).then(rep => {
        afficherMessage(rep.message);
        chargerDonnees();
      });
    }

    function ajouterProduit() {
      const nom = document.getElementById('newNom').value.trim();
      const achat = document.getElementById('newAchat').value;
      const vente = document.getElementById('newVente').value;
      const stock = document.getElementById('newStock').value;
      if (!nom || !achat || !vente || !stock) { alert("Remplissez tous les champs."); return; }
      const btn = document.getElementById('btnProd');
      btn.disabled = true; btn.innerText = "Ajout...";
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "ajouter_produit", idBoutique: idBoutique, nomProduit: nom, prixAchat: achat, prixVente: vente, stockInitial: stock })
      }).then(r => r.json()).then(rep => {
        afficherMessage(rep.message);
        document.getElementById('newNom').value = ""; document.getElementById('newAchat').value = ""; document.getElementById('newVente').value = ""; document.getElementById('newStock').value = "";
        btn.disabled = false; btn.innerText = "Ajouter au catalogue";
        chargerDonnees();
      });
    }

    window.onload = chargerDonnees;
  </script>
</body>
</html>
